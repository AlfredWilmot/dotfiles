# navigate terminal scrollback buffer using vi keybindings
setw -g mode-keys vi

# Enable focus events for vim autoread
set -g focus-events on

# copy mode uses clipboard <Ctr>+[, <SPACE>, <ENTER>
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -selection clipboard"

# Change prefix to Ctrl+a (more ergonomic)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Vim-style pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Better pane splitting (and keep current path)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind \% split-window -h -c "#{pane_current_path}"
bind \" split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# REFERENCES
# - https://tmux.info/docs/configuration
